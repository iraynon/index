<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>S6 Properties • Secure Inventory</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="assets/manifest.json">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <section class="auth-brand">
      <div class="brand-mark">S6</div>
      <span class="eyebrow">PROPERTY & ACCOUNTABILITY</span>
      <h1>Inventory Command Center</h1>
      <p>Securely manage personnel, equipment, serial numbers, assignments and accountability from one modern dashboard.</p>
      <div class="auth-points">
        <span>✓ Cloud database</span>
        <span>✓ Multi-device access</span>
        <span>✓ Role-ready security</span>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">Sign in</button>
        <button class="auth-tab" data-mode="register">Create account</button>
      </div>

      <div id="authMessage" class="notice hidden"></div>

      <form id="loginForm" class="auth-form">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
        <button class="btn btn-primary btn-wide" type="submit">Sign in <span>→</span></button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <label>Full name<input id="registerName" type="text" autocomplete="name" required placeholder="Your full name"></label>
        <label>Email<input id="registerEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input id="registerPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></label>
        <button class="btn btn-primary btn-wide" type="submit">Create account <span>→</span></button>
      </form>

      <p class="auth-foot">Protected by Supabase authentication and database security policies.</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
